name: Update README Chart Table

on:
  push:
    branches:
      - gh-pages
    paths:
      - index.yaml
      - '*.tgz'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_PAGES_APP_ID }}
          private-key: ${{ secrets.GH_PAGES_APP_PRIVATE_KEY }}

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ steps.generate_token.outputs.token }}

      - name: Install yq
        uses: frenck/action-setup-yq@c4b5be8b4a215c536a41d436757d9feb92836d4f  # v1.0.2
        with:
          version: v4.45.4

      - name: Generate Chart Table
        run: |
          bash .github/scripts/generate_chart_table.sh index.yaml > chart-table.md

      - name: Insert Chart Table into README.md
        run: |
          sed -i '/<!-- charts-start -->/,/<!-- charts-end -->/{
            /<!-- charts-start -->/!{/<!-- charts-end -->/!d}
            /<!-- charts-start -->/r chart-table.md
          }' README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(docs): update chart table in README.md [skip ci]"
            git push origin gh-pages
          fi